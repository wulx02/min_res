name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Run local end-to-end smoke test
        run: |
          smoke_dir="$RUNNER_TEMP/ext-smoke"
          mkdir -p "$smoke_dir"
          binary="$GITHUB_WORKSPACE/target/release/ext"
          cd "$smoke_dir"
          "$binary" detailed-subalgebras > detailed-subalgebras.csv
          grep '^A2,.*found' detailed-subalgebras.csv
          grep '^B3211,.*found' detailed-subalgebras.csv
          grep '^B3221,.*found' detailed-subalgebras.csv
          "$binary" compute --t 12 > compute.stdout 2> compute.stderr
          test "$(grep -Ec '^t=[0-9]+/12 ' compute.stderr)" -eq 12
          grep -qx 'saved checkpoint checkpoint/t12.checkpoint' compute.stderr
          test -d checkpoint/t12.checkpoint
          grep -q '^computed t <= 12, s <= 12, generators=' compute.stdout
          if grep -q '^fixed_t_' compute.stderr; then
            cat compute.stderr
            exit 1
          fi
          "$binary" compute --t 14 --checkpoint-every-layers 1 \
            > resume.stdout 2> resume.stderr
          grep -qx 'resuming checkpoint/t12.checkpoint at t=13' resume.stderr
          grep -qx 'saved checkpoint checkpoint/t13.checkpoint' resume.stderr
          grep -qx 'saved checkpoint checkpoint/t14.checkpoint' resume.stderr
          test -d checkpoint/t12.checkpoint
          test ! -e checkpoint/t13.checkpoint
          test -d checkpoint/t14.checkpoint
          "$binary" checkpoint verify \
            --checkpoint "$smoke_dir/checkpoint/t14.checkpoint"
          "$binary" export --t 14
          test -f csv_output/t14.csv
          test "$(head -n 1 csv_output/t14.csv)" = 's,t,rank'
