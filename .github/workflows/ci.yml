name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Run local end-to-end smoke test
        run: |
          smoke_dir="$RUNNER_TEMP/nassau-min-res-smoke"
          mkdir -p "$smoke_dir"
          binary="$GITHUB_WORKSPACE/target/release/nassau_min_res"
          cd "$smoke_dir"
          "$binary" detailed-subalgebras > detailed-subalgebras.csv
          grep '^A2,.*found' detailed-subalgebras.csv
          grep '^B3211,.*found' detailed-subalgebras.csv
          grep '^B3221,.*found' detailed-subalgebras.csv
          "$binary" compute --t 12 > compute.stdout 2> compute.stderr
          test "$(grep -Ec '^t=[0-9]+/12 ' compute.stderr)" -eq 12
          grep -qx 'saved checkpoint nassau_min_res.checkpoint' compute.stderr
          grep -q '^computed t <= 12, s <= 12, generators=' compute.stdout
          if grep -q '^fixed_t_' compute.stderr; then
            cat compute.stderr
            exit 1
          fi
          "$binary" checkpoint verify \
            --checkpoint "$smoke_dir/nassau_min_res.checkpoint"
          "$binary" export \
            --checkpoint "$smoke_dir/nassau_min_res.checkpoint" \
            --output "$smoke_dir/basis_t12.csv"
